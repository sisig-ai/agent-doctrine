name: portable-agent-workstation

services:
  workstation:
    image: ${WORKSTATION_IMAGE:-portable-agent-workstation:local}
    hostname: ${WORKSTATION_HOSTNAME:?set WORKSTATION_HOSTNAME}
    privileged: true
    restart: unless-stopped
    environment:
      WORKSTATION_HOSTNAME: ${WORKSTATION_HOSTNAME}
      HONCHO_WORKSPACE: ${HONCHO_WORKSPACE:?set HONCHO_WORKSPACE}
      HONCHO_PEER_NAME: ${HONCHO_PEER_NAME:?set HONCHO_PEER_NAME}
      OPENCODE_SERVER_PORT: ${OPENCODE_SERVER_PORT:-4096}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD}
      CLIPROXY_BASE_URL: ${CLIPROXY_BASE_URL:-}
    secrets:
      - tailscale_auth_key
      - honcho_api_key
      - porch_mcp_token
      - claude_auth
      - codex_auth
      - opencode_auth
      - cliproxy_api_key
    volumes:
      - coder-home:/home/coder
      - docker-data:/var/lib/docker
      - tailscale-state:/var/lib/tailscale

secrets:
  tailscale_auth_key:
    file: ${SECRETS_DIR:-./secrets}/tailscale_auth_key
  honcho_api_key:
    file: ${SECRETS_DIR:-./secrets}/honcho_api_key
  porch_mcp_token:
    file: ${SECRETS_DIR:-./secrets}/porch_mcp_token
  claude_auth:
    file: ${SECRETS_DIR:-./secrets}/claude_auth
  codex_auth:
    file: ${SECRETS_DIR:-./secrets}/codex_auth
  opencode_auth:
    file: ${SECRETS_DIR:-./secrets}/opencode_auth
  cliproxy_api_key:
    file: ${SECRETS_DIR:-./secrets}/cliproxy_api_key

volumes:
  coder-home:
  docker-data:
  tailscale-state:
